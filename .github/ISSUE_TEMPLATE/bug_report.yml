name: Bug Report
description: Report a bug in Quietbar
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open the Quietbar menu
        2. Choose ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: headphones
    attributes:
      label: Headphones
      options:
        - JBL Live 770NC
        - Other (say which in Additional Context)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Headphone Firmware Version
      description: Shown in the manufacturer's phone app, if you know it.
      placeholder: "e.g. 1.2.3"
  - type: input
    id: version
    attributes:
      label: Quietbar Version
      description: Which version are you running?
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS Version
      description: Quietbar requires macOS 26 or later.
      placeholder: "e.g. 26.1"
    validations:
      required: true
  - type: dropdown
    id: phone_app
    attributes:
      label: Was the manufacturer's phone app open nearby?
      description: Only one app can control the headphones at a time.
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Optional. In Terminal run `log show --last 10m --predicate 'subsystem == "dev.studiokeys.quietbar"' --info`
        and paste the output. It includes Bluetooth device names, which may contain your name;
        edit those out if you prefer.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, drag and drop or paste screenshots here.
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might be helpful.
